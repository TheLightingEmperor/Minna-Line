<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minna Line art board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .ab { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 22px; }
  .ab-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
  .ab-row figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .ab-row .mascot, .ab-row .yokai { width: 132px; height: 132px; }
  .ab-scene { position: relative; height: 230px; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; }
  .ab-row .estamp { width: 120px; height: 120px; }
  .ab-row .mach svg { width: 200px; height: 240px; }
  .ab-row .seal svg { width: 56px; height: 56px; }
</style></head>
<body><div class="ab" id="ab"></div>
<script src="art.js"></script>
<script>
  // Design reference: every drawing in the app on one page. Open /artboard.html after changing art.js.
  ART.install();
  const fig = (svg, cap) => `<figure>${svg}<figcaption>${cap}</figcaption></figure>`;
  const moods = ['calm', 'happy', 'cheer', 'wow', 'sad'], hats = ['cap', 'sakura', 'hachimaki', 'straw', 'kitsune', 'crown'], accs = ['none', 'bell', 'bow', 'scarf'];
  const stn = (id, line, jp, name) => ({ id, line, jp, name });
  document.getElementById('ab').innerHTML = `
    <h1>Minna Line art board</h1>
    <h2>Mochi: moods</h2><div class="ab-row">${moods.map((m) => fig(ART.mascot(m), m)).join('')}</div>
    <h2>Hats and accessories</h2><div class="ab-row">${hats.map((h, i) => fig(ART.mascot(moods[i % 3], { hat: h, acc: accs[i % 4] }), h + ' + ' + accs[i % 4])).join('')}</div>
    <h2>Yokai</h2><div class="ab-row">${ART.YOKAI.map((y) => fig(ART.yokai(y, 'idle'), y.name)).join('')}</div>
    <div class="ab-row">${ART.YOKAI.map((y, i) => fig(ART.yokai(y, ['hit', 'laugh', 'gone'][i % 3]), y.name + ' ' + ['hit', 'laugh', 'gone'][i % 3])).join('')}</div>
    <h2>Landscapes</h2>${['spring', 'summer', 'autumn', 'winter', 'night'].map((s) => `<div class="ab-scene">${ART.scene(s)}</div>`).join('')}
    <h2>Stamps, seals, machine</h2><div class="ab-row">${[stn('L1', 'M', 'はじめまして', 'Intro'), stn('L30', 'S', 'なつ', 'Summer'), stn('L210', 'K', 'あき', 'Autumn'), stn('L310', 'W', 'ふゆ', 'Winter'), stn('L410', 'Y', 'ほし', 'Star')].map((s, i) => fig(ART.stamp(s, String(i + 1).padStart(2, '0'), '2026.11.10'), s.line)).join('')}
      ${['spring', 'summer', 'autumn', 'winter', 'night'].map((s, i) => `<figure class="seal" style="--lv:${['#d7422a', '#2f8a7e', '#c8641f', '#2f4f86', '#6a4a8c'][i]}">${ART.seasonIcon(s)}<figcaption>${s}</figcaption></figure>`).join('')}
      <figure class="mach">${ART.machine()}<figcaption>capsule machine</figcaption></figure></div>`;
</script></body></html>
